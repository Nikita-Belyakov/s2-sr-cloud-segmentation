#### general settings
name: ediffsr2x_rgb_nir_c64_archived_250311_122854
use_tb_logger: true
model: denoising
distortion: sr
gpu_ids: [0] #,4,5,6,7]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G
  # for super-resolution
  scale: 2 # NOT USED
  
#### datasets
datasets:
  train:
    optimizer: AdamW # Adam, AdamW, Lion
    fuse: False
    only_IR: False
    use_shuffle: true
    batch_size: 12 
  val:
    n_workers: 8
    batch_size: 12
    save_dir: 'experiments/val_images/'


#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    img_channel: 4
    width: 64
    enc_blk_nums: [14, 1, 1, 1]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

#### path
path:
    pretrain_model_G: ~
    #lastest_EMA.pth
    experiments_root: experiments
#   pretrain_model_G: ~
    strict_load: true
    resume_state: ~
