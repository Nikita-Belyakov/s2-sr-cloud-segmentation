#### general settings
name: ediffsr4x_ir_c64
use_tb_logger: true
model: denoising
distortion: sr
gpu_ids: [0,1,2,3] #,4,5,6,7]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 4
  
#### datasets
datasets:
  train:
    optimizer: AdamW # Adam, AdamW, Lion
    # name: Train_Dataset
    # mode: LQGT
    #scale_list: [0.2, 0.25, 0.33334, 0.4, 0.5, 0.66667, 1] # new param
    fuse: True
    only_IR: True
    use_shuffle: true
    batch_size: 12 
    #GT_size: 256
    #LR_size: 256
    #use_flip: true
    #use_rot: true
    # color: RGB
  val:
    # name: Val_Dataset
    # mode: LQGT
    n_workers: 8
    batch_size: 12
    save_dir: 'experiments/val_images/'


#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    img_channel: 4
    width: 64
    enc_blk_nums: [14, 1, 1, 1]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

#### path
path:
  experiments_root: experiments
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~
#### training settings: learning rate scheme, loss
train:
  optimizer: AdamW # Adam, AdamW, Lion
  lr_G: !!float 4e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  niter: 1000000
  warmup_iter: -1  # no warm up
  lr_steps: [200000, 350000, 450000] # [200000, 300000, 400000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1 # was l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 2e4

#### logger
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1e4
