#### general settings
name: ediffsr2x_c64_l1
use_tb_logger: true
model: denoising
distortion: sr
gpu_ids: [0,1,2,3] #,4,5,6,7]

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 2
  
#### datasets
datasets:
  train:
    optimizer: AdamW # Adam, AdamW, Lion
    fuse: True
    only_IR: False
    use_shuffle: true
    batch_size: 12 
  val:
    n_workers: 8
    batch_size: 48
    save_dir: 'experiments/val_images/'


#### network structures
network_G:
  which_model_G: ConditionalNAFNet
  setting:
    img_channel: 8
    width: 64
    enc_blk_nums: [14, 1, 1, 1]
    middle_blk_num: 1
    dec_blk_nums: [1, 1, 1, 1]

#### path
path:
  experiments_root: experiments
  pretrain_model_G: ~
  strict_load: true
  resume_state: ~

#### training settings: learning rate scheme, loss
train:
  optimizer: AdamW # Adam, AdamW, Lion
  lr_G: !!float 4e-5
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  niter: 500000
  warmup_iter: -1  # no warm up
  lr_steps: [10000, 490000, 400000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7

  # criterion
  is_weighted: False
  loss_type: l1 # was l1
  weight: 1.0

  manual_seed: 0
  val_freq: !!float 2e4 #5e3

#### logger
logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 1e4
